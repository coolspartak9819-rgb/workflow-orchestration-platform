apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-api
  namespace: workflows
  labels:
    app: workflow-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: workflow-api
  template:
    metadata:
      labels:
        app: workflow-api
    spec:
      containers:
        - name: api
          image: ghcr.io/coolspartak9819-rgb/workflow-orchestration-platform:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: workflow-api-config
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
