services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      NATS_URL: nats://nats:4222
    depends_on:
      - nats
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    command: ["-js"]
    ports:
      - "4222:4222"
      - "8222:8222"
    restart: unless-stopped
