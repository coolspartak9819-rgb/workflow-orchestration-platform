services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      NATS_URL: nats://nats:4222
      DATABASE_URL: postgresql://workflows:workflows@postgres:5432/workflows
    depends_on:
      - nats
      - postgres
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    command: ["-js"]
    ports:
      - "4222:4222"
      - "8222:8222"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: workflows
      POSTGRES_PASSWORD: workflows
      POSTGRES_DB: workflows
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/001_workflows.sql:/docker-entrypoint-initdb.d/001_workflows.sql:ro
    restart: unless-stopped

volumes:
  postgres-data:
